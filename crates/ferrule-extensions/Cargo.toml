[package]
name = "ferrule-extensions"
version = "0.1.0"
edition = "2021"
description = "Self-extension: allow-listed MCP servers and skills installed mid-session, pinned, scanned and hot-loaded"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-mcp = { path = "../ferrule-mcp" }
ferrule-skills = { path = "../ferrule-skills" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-tools = { path = "../ferrule-tools" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ring = "0.17"

[dev-dependencies]
