[package]
name = "ferrule-learn"
version = "0.2.0"
edition = "2021"
description = "The M16 learning loop: a gated delta playbook, memory consolidation and the offline pass that writes them"

[dependencies]
dunce = { workspace = true }
ferrule-core = { path = "../ferrule-core" }
ferrule-eval = { path = "../ferrule-eval" }
ferrule-memory = { path = "../ferrule-memory" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-tools = { path = "../ferrule-tools" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
