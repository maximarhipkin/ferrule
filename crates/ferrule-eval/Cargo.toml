[package]
name = "ferrule-eval"
version = "0.3.0"
edition = "2021"
description = "ferrule eval: task suites, fixtures, graders, the naive/engineered A/B and its reports"

[dependencies]
dunce = { workspace = true }
ferrule-core = { path = "../ferrule-core" }
ferrule-tools = { path = "../ferrule-tools" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-skills = { path = "../ferrule-skills" }
ferrule-codemap = { path = "../ferrule-codemap", default-features = false }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
