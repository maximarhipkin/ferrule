# Services ferrule can connect (M20, docs/m20-connections.md §2).
#
# Each entry was checked on 2026-09-25 against the vendor's docs, and the
# OAuth metadata of each host fetched live. Adding a service is adding a
# table; an owner can add their own in `[[connections.custom]]`, or connect
# any remote MCP server that does OAuth discovery + DCR by its URL.
#
#   auth       "oauth" | "api_key"
#   client     oauth: "dcr" (ferrule registers itself) | "owner" (a client
#              the owner made; its id and secret are <client_env>_ID and
#              <client_env>_SECRET in the secrets file)
#   scopes     asked for by default; write_scopes by `/connect <name> write`
#   read_only  how read-only is enforced: "scope" | "header" | "endpoint" |
#              "tools" (a native connection lists write tools only when
#              connected for writing) | "none" (then every tool without
#              readOnlyHint asks the owner)
#   native     M37: the tools run inside ferrule ("jira", "gmail", "google")
#   fields     M37: what a key-based way in asks for (write-only secrets)
#   tile, option, covers, guide: M37's Connections page — which tile it
#              sits on, its option's name, what it covers, the steps
#   fixed_callback  M37: sign-in only through the relay's fixed address
#   preview    M37: a vendor preview, offered last
#   preset     M63.2: field values the catalog fixes (a mail provider's
#              servers); never asked for, never taken from the form
#
# Catalog v2 (M63.4, docs/m63-connections-wave-b.md §4). Every entry here
# is vetted by hand: an official, maintained server, its address or
# package checked against the vendor's own docs on the date given.
#   kind       "remote" (the default: the vendor hosts it at `url`) |
#              "stdio" (a pinned package run in the sandbox) | "skill"
#              (one of ferrule's bundled skills, `skill`)
#   auth       "oauth" | "api_key" (or "key") | "none"
#   package    stdio: npm:<name>@<exact version>; `args`, `read_only_args`
#              (added unless the owner asks for writes), `env` (no keys),
#              `integrity` (as published, for the record)
#   registry   its name in the official MCP Registry (identity only)
#   secret     { name, hosts, header, value }: the key `mcp_add` with
#              `catalog` asks the owner for with secret_request, bound to
#              exactly these hosts; never hosts from the model
#   read_only_url  the address used while read-only (the default)
#   writes     tools that change something, whatever their hints say

# ── Atlassian: three ways in, simplest first (M37 §3.5). ──

[[service]]
name = "jira"
title = "Jira & Confluence (email + API token)"
url = "https://api.atlassian.com"
auth = "api_key"
native = "jira"
read_only = "tools"
tile = "atlassian"
option = "Email + API token"
covers = "Jira issues (search, read, create, update, comment, move) and Confluence pages (search, read), with your own permissions. Works on any site, no admin switch needed."
key_url = "https://id.atlassian.com/manage-profile/security/api-tokens"
docs = "https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/"
revoke_note = "Revoke the token at https://id.atlassian.com/manage-profile/security/api-tokens to cut it off at Atlassian too."
guide = [
  "Open https://id.atlassian.com/manage-profile/security/api-tokens (signed in as you).",
  "Press Create API token, name it ferrule, pick how long it lasts (up to a year), and copy it.",
  "Below: your site (the address you open Jira at, like acme.atlassian.net), the email you sign in with, and the token.",
  "Test checks it against your site; Save keeps it sealed. Nothing leaves this server except to your site.",
]
[[service.fields]]
name = "site"
label = "Site"
placeholder = "yourcompany.atlassian.net"
[[service.fields]]
name = "email"
label = "Atlassian email"
kind = "email"
[[service.fields]]
name = "token"
label = "API token"
secret = true
kind = "password"
[[service.fields]]
name = "expires"
label = "Token expires on"
kind = "date"
optional = true
hint = "Atlassian tokens last 1 to 365 days; ferrule warns you a week before."

[[service]]
name = "atlassian_token"
title = "Atlassian Rovo MCP (API token)"
url = "https://mcp.atlassian.com/v2/mcp"
auth = "api_key"
header = "Authorization"
header_value = "{basic:email:token}"
read_only = "none"
tile = "atlassian"
option = "Rovo MCP with an API token"
covers = "Atlassian's own MCP server: Jira, Confluence and Compass tools as Atlassian ships them."
key_url = "https://id.atlassian.com/manage-profile/security/api-tokens"
docs = "https://support.atlassian.com/atlassian-rovo-mcp-server/docs/configuring-authentication-via-api-token/"
note = "Needs your Atlassian admin to allow API-token sign-in: admin.atlassian.com → Rovo → Rovo MCP server → Authentication."
guide = [
  "Ask your Atlassian admin to turn on API tokens at admin.atlassian.com → Rovo → Rovo MCP server → Authentication (it's off by default).",
  "Make a token at https://id.atlassian.com/manage-profile/security/api-tokens (a scoped token works too).",
  "Enter your email and the token. A service account's key goes in alone: leave the email empty.",
]
[[service.fields]]
name = "email"
label = "Atlassian email"
kind = "email"
optional = true
hint = "Leave empty for a service account's key."
[[service.fields]]
name = "token"
label = "API token"
secret = true
kind = "password"
[[service.fields]]
name = "expires"
label = "Token expires on"
kind = "date"
optional = true

[[service]]
name = "atlassian"
title = "Atlassian Rovo MCP (sign in)"
url = "https://mcp.atlassian.com/v2/mcp"
auth = "oauth"
client = "dcr"
read_only = "none"
fixed_callback = true
tile = "atlassian"
option = "Rovo MCP with Atlassian sign-in"
covers = "Atlassian's own MCP server, signed in as you in the browser."
docs = "https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/"
note = "Your Atlassian admin must allow the callback's domain (admin.atlassian.com → Rovo → Rovo MCP server → Domains), so it needs the fixed callback address (the relay)."
guide = [
  "Set up the fixed callback address first (the card at the top).",
  "Ask your Atlassian admin to add the relay's domain under admin.atlassian.com → Rovo → Rovo MCP server → Domains, as the exact pattern shown here.",
  "Press Sign in and approve in the browser.",
]

[[service]]
name = "attio"
title = "Attio"
url = "https://mcp.attio.com/mcp"
auth = "oauth"
client = "dcr"
scopes = ["mcp", "offline_access"]
read_only = "none"
docs = "https://docs.attio.com/mcp/overview"
revoke_note = "Attio has no way to revoke a token from outside: remove ferrule under Workspace settings → Apps if you want it cut off at Attio too."

