[[service]]
name = "github"
title = "GitHub"
url = "https://api.githubcopilot.com/mcp/"
auth = "api_key"
header = "Authorization"
header_value = "Bearer {key}"
read_only = "header"
read_only_headers = { "X-MCP-Readonly" = "true" }
key_url = "https://github.com/settings/personal-access-tokens/new"
option = "Personal access token"
covers = "Repositories, issues, pull requests and Actions, as GitHub's MCP server offers them."
guide = [
  "Open https://github.com/settings/personal-access-tokens/new (a fine-grained token).",
  "Pick the repositories and the permissions it needs (read-only is enough to look), set an expiry, and generate it.",
  "Paste it below. Read-only connections also send GitHub's read-only header.",
]
docs = "https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md"
revoke_note = "Delete the token at https://github.com/settings/personal-access-tokens to cut it off at GitHub too."

