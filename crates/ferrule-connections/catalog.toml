token_url = "https://oauth2.googleapis.com/token"
revoke_url = "https://oauth2.googleapis.com/revoke"
extra_params = { access_type = "offline", prompt = "consent" }
tile = "google"
option = "Preview: Google's Drive MCP server"
covers = "Google's own Drive MCP tools. A Developer Preview: your project must be enrolled."
