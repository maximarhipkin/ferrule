[package]
name = "ferrule-ssh"
version = "0.3.0"
edition = "2021"
description = "Remote workspaces over the system OpenSSH client: the shell and file tools on another machine"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-tools = { path = "../ferrule-tools" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
