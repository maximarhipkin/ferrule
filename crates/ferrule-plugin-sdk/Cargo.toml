[package]
name = "ferrule-plugin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Write ferrule tool plugins in Rust: the ABI v1 exports, and the host's http, file, clock and random ops"
repository = "https://github.com/maximarhipkin/ferrule"
homepage = "https://github.com/maximarhipkin/ferrule/blob/main/docs/plugins.md"
documentation = "https://github.com/maximarhipkin/ferrule/blob/main/docs/plugins.md"
readme = "README.md"
keywords = ["ferrule", "plugin", "wasm", "agent", "tools"]
categories = ["wasm", "api-bindings"]
# Not published yet: the repo has no license to publish it under. Add
# `license = "…"` and drop this line to publish.
publish = false

# Kept free of the workspace's dependency table so the crate builds alone,
# as a plugin author's dependency, for wasm32-unknown-unknown.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
