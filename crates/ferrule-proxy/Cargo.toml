[package]
name = "ferrule-proxy"
version = "0.3.0"
edition = "2021"
description = "Credential gateway: sandboxed commands hold placeholders, a local proxy swaps in the real secrets for the hosts they're bound to"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
bytes = "1"
http = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-embed = { path = "../ferrule-embed", default-features = false }
ferrule-mcp = { path = "../ferrule-mcp" }
ferrule-plugins = { path = "../ferrule-plugins" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-tools = { path = "../ferrule-tools" }
serde_json = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
wat = "1"
