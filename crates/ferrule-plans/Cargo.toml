[package]
name = "ferrule-plans"
version = "0.9.0"
edition = "2021"
description = "M35 subscription plans: ChatGPT sign-in and its sealed tokens, the plans' usage windows, and the Claude Code engine that runs a turn inside the unmodified claude binary"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-connections = { path = "../ferrule-connections" }
ferrule-providers = { path = "../ferrule-providers" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# A mock issuer and Codex backend for tests, here and in the CLI.
mock = []

[dev-dependencies]
tempfile = { workspace = true }
ferrule-plans = { path = ".", features = ["mock"] }

# The engine tests' stand-in for `claude`. Not shipped: releases build
# ferrule-cli only.
[[bin]]
name = "ferrule-fake-claude"
path = "src/bin/fake-claude.rs"
test = false
doc = false
