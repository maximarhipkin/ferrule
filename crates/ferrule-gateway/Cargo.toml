[package]
name = "ferrule-gateway"
version = "0.9.1"
edition = "2021"
description = "Long-running daemon: channel adapters, session routing, scheduler"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
# M39: send_file resolves paths the way the file tools do.
ferrule-tools = { path = "../ferrule-tools" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
croner = "4.0"
# M31: the Discord Gateway and Slack Socket Mode WebSockets. No TLS feature:
# ws.rs does TLS itself with the rustls + ring + webpki roots reqwest already
# uses (no aws-lc, no OpenSSL), after an optional HTTPS_PROXY CONNECT tunnel.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# M39: HMAC-SHA256 for webhook signatures, and the relay mailbox's name.
ring = "0.17"
base64 = "0.22"
# M39 §5: email reuses M37's IMAP, SMTP and MIME (no mail crates).
ferrule-connections = { path = "../ferrule-connections" }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = "0.3"
