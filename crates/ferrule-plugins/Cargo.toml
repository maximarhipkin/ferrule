[package]
name = "ferrule-plugins"
version = "0.3.0"
edition = "2021"
description = "WASM tool plugins: a JSON core-module ABI run in wasmi, capability-checked host calls, fuel and memory limits"

[features]
default = ["runtime"]
# The interpreter. Without it manifests still parse and validate (the
# extension manager needs that), and loading a plugin says the build has
# no plugin support.
runtime = ["dep:wasmi", "dep:wasmi_core"]

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-tools = { path = "../ferrule-tools" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ring = "0.17"
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["std", "validate", "auto-dispatch"] }
# Only to name `LimiterError` in a `ResourceLimiter` impl (wasmi doesn't
# re-export it); pinned with wasmi so the types are the same.
wasmi_core = { version = "=2.0.0", optional = true, default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
wat = "1"
