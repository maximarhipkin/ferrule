[package]
name = "ferrule-otel"
version = "0.3.0"
edition = "2021"
description = "M33: the agent's work as OpenTelemetry traces (GenAI semantic conventions), exported as OTLP/JSON over HTTP from the ledger seam"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = { workspace = true }
