[package]
name = "ferrule-codemap"
version = "0.3.0"
edition = "2021"
description = "Tree-sitter repo map (ranked outline) and code_search"

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-go", "lang-java"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
# TypeScript and TSX; JavaScript is parsed with TSX
lang-typescript = ["dep:tree-sitter-typescript"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]

[dependencies]
ferrule-core = { path = "../ferrule-core" }
async-trait = { workspace = true }
dunce = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# .gitignore-aware walk without running git
ignore = "0.4"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
