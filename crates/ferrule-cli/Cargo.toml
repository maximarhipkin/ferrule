[package]
name = "ferrule-cli"
version = "0.1.0"
edition = "2021"
description = "ferrule binary: run, chat, memory, config"

[[bin]]
name = "ferrule"
path = "src/main.rs"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-providers = { path = "../ferrule-providers" }
ferrule-tools = { path = "../ferrule-tools" }
ferrule-mcp = { path = "../ferrule-mcp" }
ferrule-skills = { path = "../ferrule-skills" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-proxy = { path = "../ferrule-proxy" }
ferrule-memory = { path = "../ferrule-memory" }
ferrule-gateway = { path = "../ferrule-gateway" }
ferrule-extensions = { path = "../ferrule-extensions" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { workspace = true }
inquire = "0.9"
toml_edit = "0.22"
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
