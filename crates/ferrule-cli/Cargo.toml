[package]
name = "ferrule-cli"
version = "0.3.0"
edition = "2021"
description = "ferrule binary: run, chat, memory, config"

[[bin]]
name = "ferrule"
path = "src/main.rs"

[features]
default = ["grammars", "local-embed", "plugins"]
# M29: the repo map's tree-sitter grammars. Without them `code_search` is a
# text search and there is no map.
grammars = ["ferrule-codemap/default"]
# M30: the in-process embedding model (`[memory] embedder = "local"`).
# Without it, `local` falls back to keyword recall and doctor says so.
local-embed = ["ferrule-embed/local"]
# M32: the WASM interpreter (wasmi) that runs tool plugins. Without it
# installed plugins still list, but none loads or installs, and doctor says so.
plugins = ["ferrule-plugins/runtime"]

[dependencies]
dunce = { workspace = true }
ferrule-core = { path = "../ferrule-core" }
ferrule-providers = { path = "../ferrule-providers" }
ferrule-tools = { path = "../ferrule-tools" }
ferrule-mcp = { path = "../ferrule-mcp" }
ferrule-skills = { path = "../ferrule-skills" }
ferrule-sandbox = { path = "../ferrule-sandbox" }
ferrule-proxy = { path = "../ferrule-proxy" }
ferrule-memory = { path = "../ferrule-memory" }
ferrule-embed = { path = "../ferrule-embed", default-features = false }
ferrule-gateway = { path = "../ferrule-gateway" }
ferrule-agents = { path = "../ferrule-agents" }
ferrule-extensions = { path = "../ferrule-extensions" }
ferrule-eval = { path = "../ferrule-eval" }
ferrule-hooks = { path = "../ferrule-hooks" }
ferrule-learn = { path = "../ferrule-learn" }
ferrule-trust = { path = "../ferrule-trust" }
ferrule-connections = { path = "../ferrule-connections" }
ferrule-codemap = { path = "../ferrule-codemap", default-features = false }
ferrule-plugins = { path = "../ferrule-plugins", default-features = false }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# M28: the host a [web_search] key is bound to.
url = "2"
reqwest = { workspace = true }
inquire = "0.9"
toml_edit = "0.22"
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
# M32: the plugin fixture is WAT, assembled in the test.
wat = "1"
# The M20 mocks (an OAuth + MCP provider, the relay), shared with
# ferrule-connections' own tests through `#[path]`.
bytes = "1"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ring = "0.17"
# M31: the gateway crate's Discord and Slack mocks, through `#[path]`.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
