[package]
name = "ferrule-cli"
version = "0.1.0"
edition = "2021"
description = "ferrule binary: run, chat, memory, config"

[[bin]]
name = "ferrule"
path = "src/main.rs"

[dependencies]
ferrule-core = { path = "../ferrule-core" }
ferrule-providers = { path = "../ferrule-providers" }
ferrule-tools = { path = "../ferrule-tools" }
ferrule-memory = { path = "../ferrule-memory" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
