<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-label="Ferrule roadmap: shipped, next, planned">
  <defs>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cdd4da; font-size: 13px; }
      .t { font-size: 20px; font-weight: 700; fill: #e09668; }
      .h { font-size: 15px; font-weight: 700; }
      .k { font-weight: 700; fill: #e09668; }
      .s { fill: #96a0aa; }
      .d { fill: #8a929a; }
    </style>
  </defs>
  <rect width="960" height="512" rx="16" fill="#0d0f12"/>
  <text x="32" y="44" class="t">Roadmap</text>
  <text x="32" y="66" class="s">September 2026</text>

  <rect x="32" y="84" width="288" height="404" rx="12" fill="#17191c" stroke="#c4764a" stroke-width="1.5"/>
  <text x="52" y="114" class="h" style="fill:#e09668">Shipped</text>
  <g>
    <circle cx="58" cy="146" r="6" fill="#c4764a"/><text x="74" y="151" class="k">M1–2</text><text x="134" y="151">Gateway, Telegram, local</text>
    <circle cx="58" cy="180" r="6" fill="#c4764a"/><text x="74" y="185" class="k">M3</text><text x="134" y="185">Cron + one-shot scheduler</text>
    <circle cx="58" cy="214" r="6" fill="#c4764a"/><text x="74" y="219" class="k">M4</text><text x="134" y="219">MCP client (stdio)</text>
    <circle cx="58" cy="248" r="6" fill="#c4764a"/><text x="74" y="253" class="k">Phase 0</text><text x="134" y="253">Per-call cost ledger</text>
    <circle cx="58" cy="282" r="6" fill="#c4764a"/><text x="74" y="287" class="k">M5</text><text x="134" y="287">Agent Skills (SKILL.md)</text>
    <circle cx="58" cy="316" r="6" fill="#c4764a"/><text x="74" y="321" class="k">M6</text><text x="134" y="321">OS sandbox for the shell</text>
    <circle cx="58" cy="350" r="6" fill="#c4764a"/><text x="74" y="355" class="k">M7</text><text x="134" y="355">Credential gateway</text>
    <circle cx="58" cy="384" r="6" fill="#c4764a"/><text x="74" y="389" class="k">M8</text><text x="134" y="389">Installer + setup wizard</text>
    <circle cx="58" cy="418" r="6" fill="#c4764a"/><text x="74" y="423" class="k">M9</text><text x="134" y="423">Never stuck + verifier</text>
    <circle cx="58" cy="452" r="6" fill="#c4764a"/><text x="74" y="457" class="k">M10</text><text x="134" y="457">MCP confined &amp; proxied</text>
  </g>

  <rect x="336" y="84" width="288" height="404" rx="12" fill="#17191c" stroke="#96a0aa"/>
  <text x="356" y="114" class="h">Next</text>
  <text x="400" y="114" class="s" style="font-size:12px">M11–13 approved · M14–19 proposed</text>
  <g>
    <circle cx="362" cy="146" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="151">M11: browser (installed Chrome)</text>
    <circle cx="362" cy="180" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="185">M12: multi-agent orchestration</text>
    <circle cx="362" cy="214" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="219">M13: self-extension (vetted)</text>
    <circle cx="362" cy="248" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="253">M14: ferrule eval</text>
    <circle cx="362" cy="282" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="287">M15: memory update + history</text>
    <circle cx="362" cy="316" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="321">M16: learning loop (playbook)</text>
    <circle cx="362" cy="350" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="355">M17: MCP hot-add + mcp add</text>
    <circle cx="362" cy="384" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="389">M18: lifecycle hooks</text>
    <circle cx="362" cy="418" r="5.5" fill="none" stroke="#e09668" stroke-width="2"/><text x="378" y="423">M19: budget caps + approvals</text>
  </g>

  <rect x="640" y="84" width="288" height="404" rx="12" fill="#17191c" stroke="#2a2e33"/>
  <text x="660" y="114" class="h s">Planned</text>
  <g>
    <circle cx="666" cy="146" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="151" class="d">Multi-provider routing (Phase 1)</text>
    <circle cx="666" cy="180" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="185" class="d">Codex Responses + Claude drivers</text>
    <circle cx="666" cy="214" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="219" class="d">Sandbox file reads</text>
    <circle cx="666" cy="248" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="253" class="d">Sandbox for native Windows</text>
    <circle cx="666" cy="282" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="287" class="d">Code-extension plugins</text>
    <circle cx="666" cy="316" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="321" class="d">Vector recall, local embeddings</text>
    <circle cx="666" cy="350" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="355" class="d">Streaming responses (SSE)</text>
    <circle cx="666" cy="384" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="389" class="d">WASM tool plugins</text>
    <circle cx="666" cy="418" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="423" class="d">Tree-sitter code search</text>
    <circle cx="666" cy="452" r="5.5" fill="none" stroke="#6b737b" stroke-width="2" stroke-dasharray="3 2"/><text x="682" y="457" class="d">More channels (Discord, Slack…)</text>
  </g>
</svg>
