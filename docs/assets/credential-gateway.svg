<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Credential gateway: sandboxed commands hold a placeholder; ferrule's proxy swaps in the real secret only for the bound host">
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e09668"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#96a0aa"/></marker>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cdd4da; font-size: 12px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 15px; font-weight: 700; }
      .t { font-size: 20px; font-weight: 700; fill: #e09668; }
      .s { fill: #96a0aa; }
      .c { fill: #e09668; }
      .m { fill: #6b737b; font-size: 11px; }
      .l { font-size: 11px; }
    </style>
  </defs>
  <rect width="960" height="440" rx="16" fill="#0d0f12"/>
  <text x="32" y="44" class="t">Credential gateway</text>
  <text x="32" y="66" class="s" style="font-size:13px">The agent's commands never hold the real secret. They don't need to.</text>

  <rect x="32" y="84" width="284" height="252" rx="12" fill="none" stroke="#96a0aa" stroke-dasharray="5 4"/>
  <text x="48" y="106" class="s l">OS SANDBOX · Landlock / Seatbelt</text>
  <rect x="48" y="118" width="252" height="202" rx="10" fill="#17191c" stroke="#2a2e33"/>
  <text x="64" y="142" class="h">agent's shell command</text>
  <text x="64" y="170" class="mono">$ echo $GITHUB_TOKEN</text>
  <text x="64" y="189" class="mono c">ghp_4e0c9a71f2…b71d</text>
  <text x="64" y="206" class="m">a placeholder, same shape as the real one</text>
  <text x="64" y="236" class="mono">$ gh api user</text>
  <text x="64" y="255" class="mono">$ git push</text>
  <text x="64" y="274" class="mono">$ curl -u x:$GITHUB_TOKEN …</text>
  <text x="64" y="304" class="m">gh, git, curl and SDKs work unchanged</text>

  <line x1="300" y1="200" x2="402" y2="200" stroke="#96a0aa" stroke-width="2" marker-end="url(#as)"/>
  <text x="360" y="190" class="s l" text-anchor="middle">HTTPS_PROXY</text>

  <rect x="404" y="118" width="228" height="202" rx="12" fill="#17191c" stroke="#c4764a" stroke-width="1.5"/>
  <text x="420" y="144" class="h c">ferrule proxy</text>
  <text x="420" y="162" class="s l">127.0.0.1 · inside the ferrule process</text>
  <text x="420" y="192">bound host → TLS intercept</text>
  <text x="420" y="214">placeholder → real value in</text>
  <text x="432" y="232" class="s">Authorization, *-key, *-token…</text>
  <text x="420" y="256">URL only with <tspan class="mono c">in_url = true</tspan></text>
  <text x="420" y="280">responses: real → placeholder</text>
  <text x="420" y="304">other hosts → blind tunnel</text>

  <rect x="692" y="96" width="236" height="96" rx="12" fill="#17191c" stroke="#2a2e33"/>
  <text x="708" y="124" class="h">api.github.com</text>
  <text x="708" y="142" class="c l">bound to GITHUB_TOKEN</text>
  <text x="708" y="170">receives the real token</text>
  <line x1="632" y1="140" x2="690" y2="140" stroke="#e09668" stroke-width="2" marker-end="url(#ac)"/>
  <text x="661" y="132" class="c l" text-anchor="middle">real</text>
  <line x1="690" y1="172" x2="634" y2="172" stroke="#96a0aa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#as)"/>
  <text x="661" y="188" class="s l" text-anchor="middle">scrubbed</text>

  <rect x="692" y="236" width="236" height="96" rx="12" fill="#17191c" stroke="#2a2e33"/>
  <text x="708" y="264" class="h">any other host</text>
  <text x="708" y="282" class="s l">blind CONNECT tunnel, no TLS intercept</text>
  <text x="708" y="310">gets only the useless placeholder</text>
  <line x1="632" y1="284" x2="690" y2="284" stroke="#96a0aa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#as)"/>
  <text x="661" y="276" class="s l" text-anchor="middle">as is</text>

  <text x="32" y="372" class="s">The real value lives only in ferrule's memory: no file holds it, and the sandbox can't read ferrule's /proc/&lt;pid&gt;/environ.</text>
  <rect x="32" y="388" width="896" height="32" rx="8" fill="#17191c"/>
  <text x="48" y="409" class="mono"><tspan class="s">[secrets]</tspan>   GITHUB_TOKEN = <tspan class="c">["api.github.com", "*.githubusercontent.com"]</tspan></text>
</svg>
