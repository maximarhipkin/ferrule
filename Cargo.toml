[workspace]
resolver = "2"
members = [
    "crates/ferrule-core",
    "crates/ferrule-gateway",
    "crates/ferrule-providers",
    "crates/ferrule-tools",
    "crates/ferrule-mcp",
    "crates/ferrule-skills",
    "crates/ferrule-sandbox",
    "crates/ferrule-proxy",
    "crates/ferrule-memory",
    "crates/ferrule-embed",
    "crates/ferrule-cli",
    "crates/ferrule-agents",
    "crates/ferrule-extensions",
    "crates/ferrule-eval",
    "crates/ferrule-hooks",
    "crates/ferrule-learn",
    "crates/ferrule-trust",
    "crates/ferrule-connections",
    "crates/ferrule-codemap",
    "crates/ferrule-otel",
    "crates/ferrule-plugins",
    "crates/ferrule-plugin-sdk",
]
# The example plugins build for wasm32-unknown-unknown on their own
# (examples/plugins/build.sh); their .wasm output is committed.
exclude = ["examples/plugins"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "5"
tempfile = "3"
libc = "0.2"
# canonicalize without Windows' `\\?\` verbatim prefix, which git,
# python and cmd.exe can't take (the same as std::fs::canonicalize elsewhere).
dunce = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
