# Push a tag such as v0.2.0 to build every target and publish a GitHub
# release with the archives, their .sha256 files, install.sh and install.ps1
# (what the install one-liners in the README download). Run it by hand
# (workflow_dispatch) to build and upload the archives without releasing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Static Linux binaries: the bundled SQLite and ring are C, so they
      # need a musl C compiler too.
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ferrule-cli

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          COPYFILE_DISABLE: "1" # no macOS ._ files in the tarball
        run: |
          name=ferrule-${{ matrix.target }}.tar.gz
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/ferrule README.md stage/
          if [ "$RUNNER_OS" = Linux ]; then
            file stage/ferrule | grep -Eq 'static(-pie|ally) linked' || { file stage/ferrule; exit 1; }
          fi
          tar -czf "dist/$name" -C stage ferrule README.md
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi >"$name.sha256"
          cat "$name.sha256"
          # Unpack to check, outside dist/: everything in dist/ is uploaded.
          mkdir ../check && tar -xzf "$name" -C ../check ferrule && ../check/ferrule --version

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = 'ferrule-${{ matrix.target }}.zip'
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ferrule.exe, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath dist/$name
          $hash = (Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/$name.sha256 -Value "$hash  $name" -Encoding ascii
          Get-Content dist/$name.sha256
          & stage/ferrule.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # M36: a minisign signature beside each archive, which `ferrule
      # update` checks against the key built into it. Without the secret
      # (a fork) the release goes out unsigned, and updaters refuse it.
      - name: Sign
        env:
          FERRULE_SIGNING_KEY: ${{ secrets.FERRULE_SIGNING_KEY }}
        run: |
          if [ -z "$FERRULE_SIGNING_KEY" ]; then
            echo "::notice::FERRULE_SIGNING_KEY isn't set: the release is unsigned, and ferrule update won't install it"
            exit 0
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FERRULE_SIGNING_KEY" >"$key"
          # The key must be the one the binaries trust.
          pub=$(sh .github/scripts/minisign.sh pub "$key")
          grep -qx "$pub" crates/ferrule-cli/src/update/release.pub \
            || { echo "::error::the signing key doesn't match crates/ferrule-cli/src/update/release.pub"; exit 1; }
          sh .github/scripts/minisign.sh sign "$key" "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.2.0-rc.1 and the like are pre-releases: `releases/latest`,
          # which the installers use by default, skips them.
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $pre

  # M44: the managed-mode image, one bot per container (docs/docker.md),
  # built from the static musl binaries above for amd64 and arm64. On a tag
  # only: ghcr.io/<owner>/ferrule:<tag> and :<tag>-browser, and :latest and
  # :latest-browser unless the tag is a pre-release (v0.12.0-rc.1).
  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-linux-musl
          path: archives
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          set -eu
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-musl
            (cd archives && sha256sum -c "ferrule-$target.tar.gz.sha256")
            mkdir -p "dist/$arch"
            tar -xzf "archives/ferrule-$target.tar.gz" -C "dist/$arch" ferrule
          done
          file dist/*/ferrule
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ferrule
          tag=$GITHUB_REF_NAME
          plain="$image:$tag"; browser="$image:$tag-browser"
          case "$tag" in
            *-*) ;;
            *) plain="$plain,$image:latest"; browser="$browser,$image:latest-browser" ;;
          esac
          echo "plain=$plain" >>"$GITHUB_OUTPUT"
          echo "browser=$browser" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: FERRULE_BIN_FROM=prebuilt
          tags: ${{ steps.tags.outputs.plain }}
          push: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-browser
          platforms: linux/amd64,linux/arm64
          build-args: FERRULE_BIN_FROM=prebuilt
          tags: ${{ steps.tags.outputs.browser }}
          push: true
