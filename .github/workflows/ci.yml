name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The browser tests drive the runner's own Chrome; only agent-browser
      # is fetched, pinned to the version the code is built against.
      - name: agent-browser
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=agent-browser-linux-x64 ;;
            macOS) asset=agent-browser-darwin-arm64 ;;
            Windows) asset=agent-browser-win32-x64.exe ;;
          esac
          dir="$RUNNER_TEMP/agent-browser"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$asset" \
            "https://github.com/vercel-labs/agent-browser/releases/download/v0.38.1/$asset"
          chmod +x "$dir/$asset"
          "$dir/$asset" --version
          echo "FERRULE_AGENT_BROWSER=$dir/$asset" >> "$GITHUB_ENV"
          echo "FERRULE_REQUIRE_BROWSER_TEST=1" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # The sandbox and service code paths only this OS has.
      - name: Sandbox self-test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked -p ferrule-cli
          mkdir -p "$RUNNER_TEMP/ws"
          cd "$RUNNER_TEMP/ws"
          "$GITHUB_WORKSPACE/target/debug/ferrule" sandbox

      - name: End-to-end (setup wizard, saved keys out of the agent's reach)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pexpect
          cargo build --locked -p ferrule-cli
          "$RUNNER_TEMP/venv/bin/python" tests_e2e/setup_wizard.py
          python3 tests_e2e/hidden_keys.py
